  });

  // Status Switcher
  const btnVisited = document.getElementById('status-visited');
  const btnWishlist = document.getElementById('status-wishlist');

  btnVisited.addEventListener('click', () => {
    btnVisited.className = "flex-1 py-2 px-4 rounded-full flex items-center justify-center gap-1.5 bg-[#E3EFE8] text-[#2C573F] shadow-sm transition-all";
    btnWishlist.className = "flex-1 py-2 px-4 rounded-full flex items-center justify-center gap-1.5 text-outline hover:text-on-surface transition-all";
  });

  btnWishlist.addEventListener('click', () => {
    btnWishlist.className = "flex-1 py-2 px-4 rounded-full flex items-center justify-center gap-1.5 bg-[#FCEBD9] text-[#8A5229] shadow-sm transition-all";
    btnVisited.className = "flex-1 py-2 px-4 rounded-full flex items-center justify-center gap-1.5 text-outline hover:text-on-surface transition-all";
  });

  // Interactive Vibe Multi-select
  const vibeButtons = document.querySelectorAll('.vibe-tag');
  vibeButtons.forEach(vibe => {
    vibe.addEventListener('click', () => {
      const isSelected = vibe.classList.contains('bg-secondary-container');
      if (isSelected) {
        vibe.className = 'vibe-tag px-3 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-high text-on-surface-variant hover:text-on-surface transition-all active:scale-95';
        const star = vibe.querySelector('span:last-child');
        if (star && star.textContent.trim() === '✦') star.remove();
      } else {
        vibe.className = 'vibe-tag px-3 py-1.5 rounded-full font-label-md text-label-md bg-secondary-container text-on-secondary-fixed font-semibold flex items-center gap-1 shadow-sm transition-transform active:scale-95';
        const star = document.createElement('span');
        star.className = 'text-[10px]';
        star.textContent = '✦';
        vibe.appendChild(star);
      }
    });
  });

  // Interactive Rating Stars
  const starButtons = document.querySelectorAll('.star-btn');
  starButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const selectedIndex = parseInt(btn.getAttribute('data-index'), 10);
      starButtons.forEach((sBtn, idx) => {
        const starSpan = sBtn.querySelector('.material-symbols-outlined');
        if (idx < selectedIndex) {
          sBtn.className = 'star-btn text-primary transition-transform hover:scale-110 active:scale-90';
          starSpan.style.fontVariationSettings = "'FILL' 1";
        } else {
          sBtn.className = 'star-btn text-outline-variant transition-transform hover:scale-110 active:scale-90';
          starSpan.style.fontVariationSettings = "'FILL' 0";
        }
      });
    });
  });
</script></main>

</body></html>
